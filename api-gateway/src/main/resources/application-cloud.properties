# Production (Cloud Run) gateway configuration.
# Routes resolve their upstream URIs from environment variables at runtime,
# so a single image works for any environment without rebuilding.
#
# Set these env vars on the api-gateway Cloud Run service:
#   USER_SERVICE_URL   PRODUCT_SERVICE_URL   ORDER_SERVICE_URL
#   PAYMENT_SERVICE_URL (optional, payment-service is currently on hold)

spring.application.name=api-gateway
management.endpoints.web.exposure.include=health,gateway
server.port=8080

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/admin/users/**

spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**,/api/admin/products/**,/api/admin/categories/**

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**,/api/cart/**,/api/admin/orders/**

spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=${PAYMENT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**
